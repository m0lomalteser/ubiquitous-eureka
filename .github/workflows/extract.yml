name: Extract and Monitor Zip

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and monitor progress
        run: |
          echo "=== Start: System-Speicherplatz vor dem Entpacken ==="
          df -h .
          echo ""

          echo "=== Starte Entpackvorgang & Monitoring ==="
          
          # Hintergrundprozess für das Monitoring (ohne Dateicount, da es sich um 1 große Datei handelt)
          (
            while true; do
              if ! pgrep -f "unzip" > /dev/null; then
                break
              fi
              
              current_size=$(du -sh extracted_files 2>/dev/null | cut -f1)
              free_space=$(df -h . | awk 'NR==2 {print $4}')
              
              echo "[MONITOR] Aktuelle Größe der Datei: $current_size | Freier Speicher: $free_space"
              sleep 2
            done
          ) &

          mkdir -p extracted_files
          
          # Umgebungsvariable setzen, damit unzip überlappende Komponenten ignoriert (falls nötig)
          export UNZIP_DISABLE_ZIPBOMB_DETECTION=TRUE
          
          # Entpacken starten (mit -O CP850 oder Standard)
          unzip -q funnyy.zip -d extracted_files

          echo ""
          echo "=== Entpacken abgeschlossen! ==="
          du -sh extracted_files/*
          df -h .
